<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tiếng Trung HSK 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Không có danh sách bài: học sinh chỉ mở bài bằng mã QR giáo viên phát. */
:root{
  --paper:#f4f7f5; --ink:#18221e; --muted:#5a6a63; --seal:#bf3a29;
  --f-han:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--paper:#111714; --ink:#e6eee9; --muted:#9bada4; --seal:#ef7d6b; color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.6;text-align:center;padding:24px 16px;box-sizing:border-box}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--seal);font-weight:600}
h1{font-family:var(--f-han);font-size:clamp(2rem,8vw,2.8rem);margin:6px 0 8px;line-height:1.2}
p{color:var(--muted);margin:0;max-width:34ch}
.gv{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center}
.gv a{color:var(--muted);font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
.gv a:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Tài liệu lớp tiếng Trung</div>
  <h1>汉语 HSK 1</h1>
  <p>Quét mã QR thầy cô phát để mở bài học.</p>
</main>
<div class="gv"><a href="soan-bai.html">Giáo viên đăng nhập</a></div>
</body>
</html>
